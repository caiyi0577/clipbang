name: ClipBang

options:
  bundleIdPrefix: com.caiyi.clipbang
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:

  ClipBang:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Sources/App/Info.plist
      properties:
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caiyi.clipbang
        PRODUCT_NAME: ClipBang
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: ClipBangKeyboard
        embed: true

  ClipBangKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Keyboard
      - path: Sources/Shared
    info:
      path: Sources/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 剪贴炸
        CFBundleName: ClipBangKeyboard
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: ClipBangKeyboard.KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caiyi.clipbang.keyboard
        PRODUCT_NAME: ClipBangKeyboard
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: "YES"

schemes:
  ClipBang:
    build:
      targets:
        ClipBang: all
    run:
      config: Debug
    archive:
      config: Release
