name: Build iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ClipBang.xcodeproj \
            -scheme ClipBang \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包 ipa
        working-directory: ios
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/ClipBang.app out/Payload/
          cd out
          zip -r -q ClipBang.ipa Payload
          ls -lh ClipBang.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ClipBang-ipa
          path: ios/out/ClipBang.ipa
          retention-days: 30
