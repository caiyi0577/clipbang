name: Build iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# 连续推送时只保留最后一次，避免几轮任务堆在 macOS 队列里互相拖死
concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  # 轻量探针：如果连它都被秒取消，说明是账号层面的 Actions 限制；
  # 如果它跑通而 build 被取消，问题就只在 macOS runner 上。
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Actions 本身可用"

  build:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ClipBang.xcodeproj \
            -scheme ClipBang \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # 未认证 API 读不到 Actions 日志，编译失败时把日志回写进仓库，
      # 本地 git pull 就能看到精确报错，不用再靠猜。
      - name: 编译失败时回传日志
        if: failure()
        working-directory: ios
        run: |
          mkdir -p ../.ci-logs
          {
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "--- xcodebuild tail ---"
            tail -n 300 build.log 2>/dev/null || echo "(无 build.log)"
          } > ../.ci-logs/build-${{ github.run_number }}.log
          cd ..
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci-logs/build-${{ github.run_number }}.log
          git commit -m "CI 编译日志 run#${{ github.run_number }} [skip ci]" || true
          git push origin HEAD:main || true

      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: .ci-logs/*.log
          if-no-files-found: ignore

      - name: 检查产物结构
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/ClipBang.app
          echo "=== 主包 ==="
          ls -la "$APP"
          echo "=== 扩展 ==="
          ls -la "$APP/PlugIns" || echo "没有 PlugIns 目录"
          echo "=== 二进制架构 ==="
          lipo -info "$APP/ClipBang" || true
          lipo -info "$APP/PlugIns/ClipBangKeyboard.appex/ClipBangKeyboard" || true
          echo "=== 最低系统版本 ==="
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

      - name: 打包（含键盘扩展）
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/ClipBang.app
          EXT="$APP/PlugIns/ClipBangKeyboard.appex"

          if [ -d "$EXT" ]; then
            codesign --force --sign - --timestamp=none "$EXT"
          fi
          codesign --force --sign - --timestamp=none "$APP"

          rm -rf out && mkdir -p out/Payload
          ditto "$APP" out/Payload/ClipBang.app
          cd out
          zip -r -q ClipBang.ipa Payload
          ls -lh ClipBang.ipa

      - name: 打包（不含扩展，排查对照）
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/ClipBang.app
          OUT=noext
          rm -rf "$OUT" && mkdir -p "$OUT/Payload"

          ditto "$APP" "$OUT/Payload/ClipBang.app"
          rm -rf "$OUT/Payload/ClipBang.app/PlugIns"
          codesign --force --sign - --timestamp=none "$OUT/Payload/ClipBang.app"

          cd "$OUT"
          zip -r -q ClipBang-noext.ipa Payload
          ls -lh ClipBang-noext.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ClipBang-ipa
          path: |
            ios/out/ClipBang.ipa
            ios/noext/ClipBang-noext.ipa
          retention-days: 30

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            ios/out/ClipBang.ipa
            ios/noext/ClipBang-noext.ipa
